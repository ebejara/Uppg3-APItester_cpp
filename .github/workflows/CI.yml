name: CI with MinGW

on: [push, pull_request]

jobs:
  build-mingw:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}  # Använd MSYS2 bash för alla run-steg

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 + MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64         # Modern variant (rekommenderas 2026)
          update: true
          install: >-             # ← Multi-line sträng för att undvika problem
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-make 

      - name: Configure CMake with MinGW
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build --parallel $(nproc)  # Eller använd --parallel 4 om nproc inte funkar

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure